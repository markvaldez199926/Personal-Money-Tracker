services:
  - type: web
    name: personal-money-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "Personal Money Tracker"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: money-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: money-tracker-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: money-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: money-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: money-tracker-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public

databases:
  - name: money-tracker-db
    plan: free
    region: oregon
    databaseName: money_tracker
    user: tracker_user
