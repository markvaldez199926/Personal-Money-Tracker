services:
  # Nginx Web Server (Reverse Proxy)
  web:
    image: nginx:1.25-alpine
    container_name: money_tracker_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - money_tracker_net

  # PHP-FPM Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_tracker_app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - money_tracker_net

  # MySQL 8.0 Database Server
  db:
    image: mysql:8.0
    container_name: money_tracker_db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-money_tracker}
      MYSQL_USER: ${DB_USERNAME:-tracker_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - money_tracker_net

  # Laravel Background Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_tracker_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - money_tracker_net

  # Laravel Scheduled Tasks Runner (Daily recurring transactions, etc.)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_tracker_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - money_tracker_net

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  money_tracker_net:
    driver: bridge
